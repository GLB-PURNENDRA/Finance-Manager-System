# ==============================================================
# Finance System Manager - Application Configuration
# ==============================================================

server.port=${PORT:8080}

# Default Dev Profile: Embedded Persistent Relational Database (MySQL compatibility mode)
# Records persist in ./data/financedb across application restarts
spring.datasource.url=jdbc:h2:file:./data/financedb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Security & JWT Configuration
# In production, set JWT_SECRET environment variable (minimum 256 bits)
app.jwt.secret=${JWT_SECRET:9a7c3e1b8f5d2a4c6e80b2d4f6a8c0e213579bdf02468ace13579bdf02468ace}
app.jwt.expiration-ms=86400000

# File Upload limits for statement import
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Google Gemini AI Assistant Configuration - High-Throughput & Low Latency Mode
# Reads GEMINI_API_KEY from server environment variable
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_API_MODEL:gemini-3.5-flash-lite}
gemini.api.timeout-seconds=${GEMINI_API_TIMEOUT_SECONDS:30}
